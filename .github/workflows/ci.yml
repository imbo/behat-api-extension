name: CI
on:
  pull_request:
  push:
    branches:
      - main
      - "v[0-9]+.x"
permissions:
  contents: read
jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
        composer-script:
          - behat
          - cs
          - phpunit
          - sa
        php:
          - "8.3"
          - "8.4"
          - "8.5"
        include:
          - os: windows-latest
            php: "8.5"
            composer-script: behat
          - os: windows-latest
            php: "8.5"
            composer-script: phpunit
          - os: macos-latest
            php: "8.5"
            composer-script: behat
          - os: macos-latest
            php: "8.5"
            composer-script: phpunit
    runs-on: ${{ matrix.os }}
    name: composer run ${{ matrix.composer-script }} / PHP ${{ matrix.php }} (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, fileinfo, sockets
      - id: composer-cache-dir
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        shell: bash
      - id: composer-cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
      - run: composer validate --strict
      - run: composer install
      - if: ${{ matrix.composer-script == 'behat' }}
        run: php -S localhost:8080 -t ./features/bootstrap > httpd.log 2>&1 &
        shell: bash
      - run: composer run ${{ matrix.composer-script }}
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1
      - if: ${{ matrix.composer-script == 'behat' }}
        uses: actions/upload-artifact@v7
        with:
          name: httpd-logs-${{ matrix.os }}-php-${{ matrix.php }}
          path: httpd.log
  branch-protection:
    needs:
      - ci
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    name: Branch protection
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: |
          node --check .github/scripts/ci-summary.cjs
          node --test .github/scripts/ci-summary.test.cjs
      - uses: actions/github-script@v8
        continue-on-error: true
        env:
          CI_RESULT: ${{ needs.ci.result }}
        with:
          script: |
            const writeSummary = require('./.github/scripts/ci-summary.cjs');
            await writeSummary({ github, context, core, result: process.env.CI_RESULT });
      - if: ${{ needs.ci.result != 'success' }}
        run: exit 1
      - run: echo "All checks passed."
